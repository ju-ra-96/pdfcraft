[package]
name = "pdfcraft-ios"
description = "PdfCraft for iPad (aarch64-apple-ios; build and bundle with packaging/ios/package.sh)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
pdfcraft-ui-egui = { workspace = true }
# wgpu draws through Metal. No glow: iPadOS has no OpenGL to fall back to.
eframe = { workspace = true, features = ["default_fonts", "wgpu", "persistence"] }
egui = { workspace = true }
log = { workspace = true }
